<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traductor LSA · Tiempo real</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121822;
    --panel-border: #1f2937;
    --accent: #5eead4;
    --accent-dim: #2dd4bf33;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --danger: #f87171;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }

  h1 span { color: var(--accent); }

  .estado {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .punto {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    display: inline-block;
    transition: background 0.2s ease;
  }
  .punto.conectado { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  main {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .video-wrap {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 4 / 3;
  }

  video, canvas.overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  video { transform: scaleX(-1); } /* efecto espejo */

  .hud {
    position: absolute;
    left: 16px;
    bottom: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
  }

  .seña-actual {
    font-family: var(--mono);
    background: rgba(11, 15, 20, 0.72);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 140px;
  }

  .seña-actual .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .seña-actual .valor {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    min-height: 1.6rem;
  }

  .seña-actual .conf {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .controles {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  button {
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  button.primary {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:not(:disabled):hover { border-color: var(--accent); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
  }

  .panel h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 12px;
  }

  #texto-traducido {
    font-family: var(--mono);
    font-size: 1rem;
    line-height: 1.6;
    min-height: 3.2em;
    color: var(--text);
    word-wrap: break-word;
  }

  #texto-traducido .cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: parpadeo 1s step-start infinite;
  }

  @keyframes parpadeo { 50% { opacity: 0; } }

  .fila-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  small.nota {
    color: var(--text-dim);
    font-size: 0.72rem;
  }
</style>
</head>
<body>

<header>
  <h1>Traductor <span>LSA</span> · tiempo real</h1>
  <div class="estado">
    <span class="punto" id="punto-estado"></span>
    <span id="texto-estado">desconectado</span>
  </div>
</header>

<main>

  <div class="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay" class="overlay"></canvas>
    <div class="hud">
      <div class="seña-actual">
        <div class="label">Seña detectada</div>
        <div class="valor" id="seña-valor">—</div>
        <div class="conf" id="seña-conf">confianza: —</div>
      </div>
    </div>
  </div>

  <div class="controles">
    <button id="btn-iniciar" class="primary">Iniciar cámara</button>
    <button id="btn-detener" disabled>Detener</button>
    <button id="btn-limpiar">Limpiar texto</button>
  </div>

  <div class="panel">
    <h2>Texto traducido</h2>
    <div id="texto-traducido"><span class="cursor"></span></div>
  </div>

  <div class="panel">
    <div class="fila-panel">
      <h2 style="margin:0">Conexión</h2>
      <small class="nota" id="nota-conexion">ws://localhost:8000/ws/translate</small>
    </div>
  </div>

</main>

<script>
  // ---------------------------------------------------------------------
  // Configuración
  // ---------------------------------------------------------------------
  const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") +
                 location.host + "/ws/translate";
  const INTERVALO_ENVIO_MS = 120; // ~8 fps hacia el backend, suficiente para landmarks
  const JPEG_QUALITY = 0.7;

  document.getElementById("nota-conexion").textContent = WS_URL;

  // ---------------------------------------------------------------------
  // Estado
  // ---------------------------------------------------------------------
  const video = document.getElementById("video");
  const overlay = document.getElementById("overlay");
  const ctx = overlay.getContext("2d");
  const btnIniciar = document.getElementById("btn-iniciar");
  const btnDetener = document.getElementById("btn-detener");
  const btnLimpiar = document.getElementById("btn-limpiar");
  const señaValor = document.getElementById("seña-valor");
  const señaConf = document.getElementById("seña-conf");
  const textoTraducido = document.getElementById("texto-traducido");
  const puntoEstado = document.getElementById("punto-estado");
  const textoEstado = document.getElementById("texto-estado");

  let ws = null;
  let stream = null;
  let intervaloEnvio = null;
  let ultimaSeñaConfirmada = null;
  const captureCanvas = document.createElement("canvas");
  const captureCtx = captureCanvas.getContext("2d");

  function setEstado(conectado, mensaje) {
    puntoEstado.classList.toggle("conectado", conectado);
    textoEstado.textContent = mensaje;
  }

  // ---------------------------------------------------------------------
  // Cámara
  // ---------------------------------------------------------------------
  async function iniciarCamara() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 960 }, height: { ideal: 720 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();

      overlay.width = video.videoWidth || 960;
      overlay.height = video.videoHeight || 720;
      captureCanvas.width = 480; // reducimos resolución de envío para no saturar el WS
      captureCanvas.height = Math.round(480 * (video.videoHeight / video.videoWidth));

      conectarWebSocket();
      btnIniciar.disabled = true;
      btnDetener.disabled = false;
    } catch (err) {
      setEstado(false, "no se pudo acceder a la cámara");
      console.error(err);
    }
  }

  function detenerCamara() {
    if (intervaloEnvio) clearInterval(intervaloEnvio);
    if (ws) ws.close();
    if (stream) stream.getTracks().forEach((t) => t.stop());
    video.srcObject = null;
    setEstado(false, "desconectado");
    btnIniciar.disabled = false;
    btnDetener.disabled = true;
    señaValor.textContent = "—";
    señaConf.textContent = "confianza: —";
  }

  // ---------------------------------------------------------------------
  // WebSocket
  // ---------------------------------------------------------------------
  function conectarWebSocket() {
    ws = new WebSocket(WS_URL);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      setEstado(true, "conectado");
      intervaloEnvio = setInterval(enviarFrame, INTERVALO_ENVIO_MS);
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        actualizarUI(data);
      } catch (e) {
        console.error("Respuesta inválida del backend:", event.data);
      }
    };

    ws.onclose = () => {
      setEstado(false, "desconectado");
      if (intervaloEnvio) clearInterval(intervaloEnvio);
    };

    ws.onerror = (err) => {
      console.error("Error de WebSocket:", err);
    };
  }

  function enviarFrame() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
    captureCanvas.toBlob(
      (blob) => {
        if (blob) blob.arrayBuffer().then((buf) => ws.send(buf));
      },
      "image/jpeg",
      JPEG_QUALITY
    );
  }

  // ---------------------------------------------------------------------
  // UI
  // ---------------------------------------------------------------------
  function actualizarUI(data) {
    if (data.error) {
      señaValor.textContent = "error";
      señaConf.textContent = data.error;
      return;
    }

    const seña = data["seña"];
    const confianza = data["confianza"] ?? 0;
    const valida = data["valida"];

    señaValor.textContent = seña || "—";
    señaConf.textContent = `confianza: ${(confianza * 100).toFixed(0)}%`;

    if (valida && seña && seña !== ultimaSeñaConfirmada) {
      ultimaSeñaConfirmada = seña;
      agregarAlTexto(seña);
    }
    if (!valida) {
      ultimaSeñaConfirmada = null; // permite repetir la misma seña si se suelta y se vuelve a hacer
    }
  }

  function agregarAlTexto(seña) {
    const cursor = textoTraducido.querySelector(".cursor");
    const nodo = document.createTextNode(seña.length === 1 ? seña : " " + seña + " ");
    textoTraducido.insertBefore(nodo, cursor);
  }

  function limpiarTexto() {
    textoTraducido.innerHTML = '<span class="cursor"></span>';
    ultimaSeñaConfirmada = null;
  }

  btnIniciar.addEventListener("click", iniciarCamara);
  btnDetener.addEventListener("click", detenerCamara);
  btnLimpiar.addEventListener("click", limpiarTexto);
  window.addEventListener("beforeunload", detenerCamara);
</script>

</body>
</html>
